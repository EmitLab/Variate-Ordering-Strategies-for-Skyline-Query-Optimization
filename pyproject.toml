[project]
name = "skylines"
version = "0.1.0"
description = "VoS: Variate Ordering Strategies for Skyline Query Optimization"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bokeh>=3.1.0",
    "bunch-py3==2.0.0",
    "dask==2026.1.2",
    "distributed==2026.1.2",
    "matplotlib==3.9.2",
    "networkx==3.3",
    "numba==0.64.0",
    "numpy==2.1.2",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "seaborn==0.13.2",
    "tabulate==0.9.0",
    "tqdm==4.66.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
